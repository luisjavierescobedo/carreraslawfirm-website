<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Investor Access — Carreras Law Firm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #ffffff;
    color: #0F0F0F;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .gate {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .gate h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #0F0F0F;
    margin-bottom: 8px;
  }

  .gate p.sub {
    font-size: 14px;
    color: #6b6b6b;
    margin-bottom: 36px;
    font-weight: 400;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background: #ffffff;
    color: #0F0F0F;
    outline: none;
    transition: border-color 0.15s ease;
    text-align: center;
    letter-spacing: 0.02em;
  }

  input[type="password"]:focus {
    border-color: #0F0F0F;
  }

  button {
    width: 100%;
    padding: 14px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    background: #0F0F0F;
    color: #ffffff;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #2a2a2a; }
  button:active { background: #000; }

  .error {
    min-height: 20px;
    margin-top: 14px;
    font-size: 13px;
    color: #c0392b;
    letter-spacing: 0.01em;
  }

  .gate.shake { animation: shake 0.35s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
  <main class="gate" id="gate">
    <h1>Carreras Law Firm</h1>
    <p class="sub">Investor Access</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="pw" placeholder="Enter password" autofocus autocomplete="off" />
      <button type="submit">Continue</button>
    </form>
    <div class="error" id="err"></div>
  </main>

    function decodeUtf8Base64(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    function reveal() {
      const html = decodeUtf8Base64(PITCH_B64);
      document.open();
      document.write(html);
      document.close();
    }

    const form = document.getElementById('gate-form');
    const pw = document.getElementById('pw');
    const err = document.getElementById('err');
    const gate = document.getElementById('gate');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (pw.value === 'Tortilla1234!') {
        err.textContent = '';
        reveal();
      } else {
        err.textContent = 'Incorrect password';
        gate.classList.remove('shake');
        void gate.offsetWidth;
        gate.classList.add('shake');
        pw.value = '';
        pw.focus();
      }
    });
  </script>
